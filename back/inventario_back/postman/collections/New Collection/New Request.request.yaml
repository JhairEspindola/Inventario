$kind: http-request
name: Create Category
description: ""
method: POST
url: localhost:8080/api/categories
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{nombre}}",
      "descripcion": "{{descripcion}}",
      "stock": {{stock}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201 Created", function () {
          pm.response.to.have.status(201);
      });

      const body = pm.response.json();

      pm.test("Response has numeric id", function () {
          pm.expect(body.id).to.be.a("number");
      });

      pm.test("nombre matches request variable", function () {
          pm.expect(body.nombre).to.equal(pm.variables.get("nombre"));
      });

      pm.test("stock matches request variable", function () {
          pm.expect(body.stock).to.equal(Number(pm.variables.get("stock")));
      });

      pm.test("createdAt is present", function () {
          pm.expect(body.createdAt).to.be.a("string");
      });

      // Save id for subsequent requests
      pm.collectionVariables.set("categoryId", body.id);
    language: text/javascript
